<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETHEC - Validar OS</title>
<link rel="icon" href="./logo_original.png">
<style>
body{background:#070707;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;margin:0}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:20px;padding:24px;max-width:400px;width:100%;text-align:center}
.logo{width:100px;height:100px;object-fit:contain;background:#070707;border-radius:12px;border:1px solid #2a2a2a;margin-bottom:12px}
.ok{background:#22c55e;color:#000;padding:8px 12px;border-radius:20px;font-weight:900;font-size:12px;display:inline-block;margin-bottom:12px}
.info{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin:8px 0;text-align:left;font-size:13px}
.info b{color:#ff2a2a;font-size:10px;display:block;text-transform:uppercase}
.btn{background:#c81e1e;color:#fff;padding:12px;border-radius:12px;border:none;width:100%;font-weight:800;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<img src="./logo_original.png" class="logo">
<div class="ok">✅ DOCUMENTO VALIDADO</div>
<h2>BETHEC EMPILHADEIRAS</h2>
<p style="font-size:11px;color:#9a9a9a">Validação por QR Code</p>
<div class="info"><b>OS</b><span id="osNum">-</span></div>
<div class="info"><b>Empresa</b><span id="empNome">-</span></div>
<div class="info"><b>Data</b><span id="dataEm">-</span></div>
<div class="info"><b>Status</b><span style="color:#22c55e;font-weight:800">✅ Válido - BETHEC Sorocaba SP</span></div>
<button class="btn" onclick="window.location.href='./index.html'">Voltar ao App</button>
</div>
<script>
let params=new URLSearchParams(window.location.search);
document.getElementById('osNum').textContent=params.get('os')||'-';
document.getElementById('empNome').textContent=params.get('emp')?decodeURIComponent(params.get('emp')):'-';
document.getElementById('dataEm').textContent=params.get('data')||new Date().toLocaleDateString('pt-BR');
</script>
</body>
</html>

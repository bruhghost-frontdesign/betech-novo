<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BETHEC v6 PRETO</title>
<script>
// LIMPA CACHE ANTIGO AUTOMATICAMENTE
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(r=>{r.forEach(reg=>reg.unregister())});
  caches.keys().then(k=>{k.forEach(n=>caches.delete(n))});
}
localStorage.setItem('force_update','6');
</script>
<link rel="manifest" href="./manifest.json?v=6">
<link rel="icon" href="./logo_bethec_preto.png?v=6">
<link rel="apple-touch-icon" href="./logo_bethec_preto.png?v=6">
<link rel="stylesheet" href="./style.css?v=6">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<script>
// Se ainda estiver v3, força reload
if(!localStorage.getItem('v6_loaded')){
  localStorage.setItem('v6_loaded','1');
  location.href=location.href.split('?')[0]+'?v=6&force='+Date.now();
}
</script>
